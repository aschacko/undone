{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="muted">{{ field.help_text|safe }}</small>{% endif %}
    {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
  </div>
{% endfor %}
